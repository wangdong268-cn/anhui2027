function computeRouteAndSpotBounds(routesList) {
  const pts = [];
  routesList.forEach(r => {
    (r.paths || []).forEach(path => {
      path.forEach(p => pts.push(p));
    });
    (r.spot_ids || []).forEach(sid => {
      const sp = SPOTS.find(s => s.id === sid);
      if (sp && sp.coords) pts.push(sp.coords);
    });
  });
  if (!pts.length) return null;
  const lngs = pts.map(p => p[0]);
  const lats = pts.map(p => p[1]);
  const padLng = Math.max(0.03, (Math.max(...lngs) - Math.min(...lngs)) * 0.08);
  const padLat = Math.max(0.03, (Math.max(...lats) - Math.min(...lats)) * 0.08);
  return [
    Math.min(...lngs) - padLng,
    Math.min(...lats) - padLat,
    Math.max(...lngs) + padLng,
    Math.max(...lats) + padLat
  ];
}

function syncDayPills(dayKey) {
  document.querySelectorAll(".day-pill").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-day") === dayKey);
  });
}

function filterByDay(dayKey) {
  touchMode = null;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  document.getElementById("detailDrawer").classList.remove("open");
  activeDayFilter = dayKey;
  selectedRouteId = null;
  selectedSegmentId = null;
  selectedSpotId = null;
  syncDayPills(dayKey);
  renderSidebar();
  if (dayKey === "CORE" || dayKey === "ALL") {
    fitBounds(REGION_BOUNDS[dayKey]);
    return;
  }
  if (dayKey === "HOTELS") {
    fitBounds(REGION_BOUNDS["CORE"]);
    return;
  }
  const visibleDayRoutes = ROUTES_DATA.dailyRoutes.filter(r => isRouteVisible(r) && r.day === dayKey);
  const b = computeRouteAndSpotBounds(visibleDayRoutes);
  if (b) {
    fitBounds(b);
  } else if (REGION_BOUNDS[dayKey]) {
    fitBounds(REGION_BOUNDS[dayKey]);
  } else {
    renderMap();
  }
}

function fitBounds(bounds) {
  if (!bounds) return;
  const [minLng, minLat, maxLng, maxLat] = bounds;
  const w = mapStage.clientWidth || 800;
  const h = mapStage.clientHeight || 600;
  const dLng = Math.max(0.02, (maxLng - minLng) * COS_LAT);
  const dLat = Math.max(0.02, maxLat - minLat);
  const scaleX = (w * 0.78) / dLng;
  const scaleY = (h * 0.78) / dLat;
  view.scale = Math.max(35, Math.min(36000, Math.min(scaleX, scaleY)));
  view.centerLng = (minLng + maxLng) / 2;
  view.centerLat = (minLat + maxLat) / 2;
  renderMap();
}

function focusRegion(key) {
  selectedRouteId = null;
  selectedSegmentId = null;
  if (key === "CORE" || key === "ALL") {
    activeDayFilter = key;
    syncDayPills(key);
  } else {
    activeDayFilter = "CORE";
    syncDayPills("CORE");
  }
  renderSidebar();
  if (REGION_BOUNDS[key]) {
    fitBounds(REGION_BOUNDS[key]);
  }
}

function selectRoute(routeId, shouldZoom) {
  touchMode = null;
  document.getElementById("detailDrawer").classList.remove("open");
  if (selectedRouteId === routeId) {
    selectedRouteId = null;
    activeDayFilter = "CORE";
    syncDayPills("CORE");
    renderSidebar();
    fitBounds(REGION_BOUNDS["CORE"]);
    return;
  }
  const r = ROUTES_DATA.dailyRoutes.find(x => x.id === routeId);
  if (!r) return;
  selectedRouteId = routeId;
  selectedSegmentId = null;
  activeDayFilter = r.day;
  syncDayPills(r.day);
  renderSidebar();
  if (shouldZoom) {
    const b = computeRouteAndSpotBounds([r]);
    if (b) {
      fitBounds(b);
      return;
    }
  }
  renderMap();
}

function selectSegment(segId) {
  selectedSegmentId = (selectedSegmentId === segId) ? null : segId;
  selectedRouteId = null;
  renderSidebar();
  if (selectedSegmentId) {
    const seg = ROUTES_DATA.segmentsOver20km.find(s => s.id === selectedSegmentId);
    if (seg && seg.path && seg.path.length) {
      const lngs = seg.path.map(p => p[0]);
      const lats = seg.path.map(p => p[1]);
      fitBounds([Math.min(...lngs), Math.min(...lats), Math.max(...lngs), Math.max(...lats)]);
      return;
    }
  }
  renderMap();
}

function selectSpot(spotId) {
  const spot = SPOTS.find(s => s.id === spotId);
  if (!spot) return;
  selectedSpotId = spotId;
  view.centerLng = spot.coords[0];
  view.centerLat = spot.coords[1];
  if (view.scale < 260) view.scale = 340;
  renderMap();

  const drawer = document.getElementById("detailDrawer");
  const badgesEl = document.getElementById("drawerBadges");
  const titleEl = document.getElementById("drawerTitle");
  const locEl = document.getElementById("drawerLoc");
  const bodyEl = document.getElementById("drawerBody");

  let tagBadge = `<span class="d-badge" style="background:#e0f2fe;color:#0369a1;">${spot.day_label || spot.day}</span>`;
  if (spot.color_tag === "green") {
    tagBadge += `<span class="d-badge" style="background:#dcfce7;color:#065f46;border:1px solid #16a34a;">🟢 绿色可选景点</span>`;
  } else if (spot.color_tag === "yellow") {
    tagBadge += `<span class="d-badge" style="background:#fef3c7;color:#92400e;border:1px solid #d97706;">🟡 黄色参考点</span>`;
  }
  if (spot.stay_tag) {
    tagBadge += `<span class="d-badge" style="background:#4338ca;color:#fff;">${spot.stay_tag}</span>`;
  }
  tagBadge += `<span class="d-badge" style="background:#f1f5f9;color:#334155;">${spot.price_badge || ''}</span>`;
  tagBadge += `<span class="d-badge" style="background:#fef3c7;color:#b45309;">${spot.booking_badge || ''}</span>`;

  badgesEl.innerHTML = tagBadge;
  titleEl.textContent = spot.name;
  locEl.textContent = `📍 ${spot.province} · ${spot.city} · ${spot.district} ｜ ⏱️ 建议游览：${spot.visit_duration || '1~2h'}`;

  bodyEl.innerHTML = `
    <div class="info-block">
      <div class="info-block-title">📖 景点深度介绍与春节看点</div>
      <div>${spot.intro}</div>
    </div>
    <div class="info-block">
      <div class="info-block-title">💰 门票政策（成人 / 儿童 / 学生 / 老人）</div>
      <div><b>• 成人票：</b>${spot.ticket_adult}</div>
      <div style="margin-top:3px;"><b>• 儿童/学生/老人：</b>${spot.ticket_child_student}</div>
      ${spot.ticket_extra ? `<div style="margin-top:3px;color:#b45309;"><b>• 补充说明：</b>${spot.ticket_extra}</div>` : ''}
    </div>
    <div class="info-block">
      <div class="info-block-title">📱 预约放票规则与停车指南</div>
      <div>${spot.booking_detail}</div>
    </div>
    ${spot.doc_note ? `<div class="doc-quote">📝 <b>原文档备注：</b>${spot.doc_note}</div>` : ''}
  `;
  drawer.classList.add("open");
}

function openCongestionDetail(cpId) {
  const cp = ROUTES_DATA.congestionPoints.find(x => x.id === cpId);
  if (!cp) return;
  view.centerLng = cp.coords[0];
  view.centerLat = cp.coords[1];
  if (view.scale < 220) view.scale = 280;
  renderMap();

  const drawer = document.getElementById("detailDrawer");
  document.getElementById("drawerBadges").innerHTML = `<span class="d-badge" style="background:#fee2e2;color:#991b1b;">🚨 春节易堵点 · ${cp.level}</span><span class="d-badge" style="background:#f1f5f9;color:#334155;">${cp.day}</span>`;
  document.getElementById("drawerTitle").textContent = cp.name;
  document.getElementById("drawerLoc").textContent = `🕒 高峰时段：${cp.peak_hours}`;
  document.getElementById("drawerBody").innerHTML = `
    <div class="info-block">
      <div class="info-block-title">⚠️ 拥堵原因分析</div>
      <div>${cp.reason}</div>
    </div>
    <div class="info-block" style="background:#ecfdf5;border-color:#a7f3d0;">
      <div class="info-block-title" style="color:#065f46;">💡 绕行与错峰实操方案</div>
      <div style="color:#065f46;">${cp.bypass_tip}</div>
    </div>
  `;
  drawer.classList.add("open");
}

function closeDetailDrawer() {
  document.getElementById("detailDrawer").classList.remove("open");
  selectedSpotId = null;
  renderMap();
}

function zoomBy(factor, pivotX, pivotY, fastPreview) {
  const w = mapStage.clientWidth || 800;
  const h = mapStage.clientHeight || 600;
  const px = (pivotX !== undefined) ? pivotX : w / 2;
  const py = (pivotY !== undefined) ? pivotY : h / 2;
  const [lngBefore, latBefore] = unproject(px, py);
  view.scale = Math.max(35, Math.min(36000, view.scale * factor));
  view.centerLng = lngBefore - (px - w / 2) / (COS_LAT * view.scale);
  view.centerLat = latBefore + (py - h / 2) / view.scale;
  if (fastPreview) {
    applyLiveTransform();
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(renderMap, 90);
  } else {
    renderMap();
  }
}

function forwardTapAt(clientX, clientY) {
  const rect = mapStage.getBoundingClientRect();
  const px = clientX - rect.left;
  const py = clientY - rect.top;
  let best = null;
  for (let i = hitTargets.length - 1; i >= 0; i--) {
    const h = hitTargets[i];
    if (px >= h.l && px <= h.r && py >= h.t && py <= h.b) {
      if (!best || h.prio > best.prio) {
        best = h;
      }
    }
  }
  if (best && best.act) {
    best.act();
  }
}

let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let mouseMoved = false;
let startCenterLng = 0;
let startCenterLat = 0;

touchLayer.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  isDragging = true;
  mouseMoved = false;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  startCenterLng = view.centerLng;
  startCenterLat = view.centerLat;
});

window.addEventListener("mousemove", e => {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
    mouseMoved = true;
  }
  view.centerLng = startCenterLng - dx / (COS_LAT * view.scale);
  view.centerLat = startCenterLat + dy / view.scale;
  applyLiveTransform();
});

window.addEventListener("mouseup", e => {
  if (!isDragging) return;
  isDragging = false;
  if (mouseMoved) {
    renderMap();
  } else {
    forwardTapAt(e.clientX, e.clientY);
  }
});

touchLayer.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = mapStage.getBoundingClientRect();
  const factor = e.deltaY < 0 ? 1.22 : (1 / 1.22);
  zoomBy(factor, e.clientX - rect.left, e.clientY - rect.top, true);
}, { passive: false });

// 📱 120fps Hardware-Accelerated Touch Gestures (Huawei / HarmonyOS / iOS / Android)
// During finger movement, only GPU CSS transform (applyLiveTransform) runs; full vector renderMap() runs once on finger lift!
let touchMode = null;
let touchStartX = 0;
let touchStartY = 0;
let touchMaxMove = 0;
let touchStartLng = 0;
let touchStartLat = 0;
let pinchStartDist = 0;
let pinchStartScale = 110;
let pinchAnchorLng = 117.15;
let pinchAnchorLat = 32.15;
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;

function initPinchState(t0, t1) {
  touchMode = "pinch";
  touchMaxMove = 999;
  pinchStartDist = Math.max(12, Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY));
  pinchStartScale = view.scale;
  const rect = mapStage.getBoundingClientRect();
  const midX = (t0.clientX + t1.clientX) / 2 - rect.left;
  const midY = (t0.clientY + t1.clientY) / 2 - rect.top;
  const [lng0, lat0] = unproject(midX, midY);
  pinchAnchorLng = lng0;
  pinchAnchorLat = lat0;
}

touchLayer.addEventListener("touchstart", e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchMode = "pan";
    touchMaxMove = 0;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartLng = view.centerLng;
    touchStartLat = view.centerLat;
  } else if (e.touches.length >= 2) {
    initPinchState(e.touches[0], e.touches[1]);
  }
}, { passive: false });

touchLayer.addEventListener("touchmove", e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    if (touchMode !== "pinch") {
      initPinchState(e.touches[0], e.touches[1]);
      return;
    }
    const t0 = e.touches[0];
    const t1 = e.touches[1];
    const dist = Math.max(12, Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY));
    const rect = mapStage.getBoundingClientRect();
    const midX = (t0.clientX + t1.clientX) / 2 - rect.left;
    const midY = (t0.clientY + t1.clientY) / 2 - rect.top;
    const w = mapStage.clientWidth || 800;
    const h = mapStage.clientHeight || 600;

    view.scale = Math.max(35, Math.min(36000, pinchStartScale * (dist / pinchStartDist)));
    view.centerLng = pinchAnchorLng - (midX - w / 2) / (COS_LAT * view.scale);
    view.centerLat = pinchAnchorLat + (midY - h / 2) / view.scale;
    applyLiveTransform();
  } else if (touchMode === "pan" && e.touches.length === 1) {
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const moveDist = Math.hypot(dx, dy);
    if (moveDist > touchMaxMove) touchMaxMove = moveDist;
    if (moveDist > 2) {
      view.centerLng = touchStartLng - dx / (COS_LAT * view.scale);
      view.centerLat = touchStartLat + dy / view.scale;
      applyLiveTransform();
    }
  }
}, { passive: false });

touchLayer.addEventListener("touchend", e => {
  e.preventDefault();
  if (e.touches.length === 0) {
    const wasMoved = touchMaxMove >= 8 || touchMode === "pinch";
    const prevMode = touchMode;
    touchMode = null;
    if (wasMoved) {
      renderMap();
    } else if (prevMode === "pan" && e.changedTouches.length > 0) {
      const t = e.changedTouches[0];
      const now = Date.now();
      if (now - lastTapTime < 300 && Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < 30) {
        const rect = mapStage.getBoundingClientRect();
        zoomBy(1.7, t.clientX - rect.left, t.clientY - rect.top, false);
        lastTapTime = 0;
      } else {
        lastTapTime = now;
        lastTapX = t.clientX;
        lastTapY = t.clientY;
        forwardTapAt(t.clientX, t.clientY);
      }
    }
  } else if (e.touches.length === 1) {
    touchMode = "pan";
    touchMaxMove = 999;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartLng = view.centerLng;
    touchStartLat = view.centerLat;
  }
}, { passive: false });

touchLayer.addEventListener("touchcancel", () => {
  touchMode = null;
  renderMap();
});

window.addEventListener("resize", () => {
  updateToggleBtnLabel();
  renderMap();
});

updateToggleBtnLabel();
renderSidebar();
focusRegion("CORE");
</script>
