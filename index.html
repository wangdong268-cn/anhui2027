<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        h1 {
            font-size: 2.5rem;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 48px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 960px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            text-decoration: none;
            color: #1a1a2e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .card .icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        .card .title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card .desc {
            font-size: 0.9rem;
            color: #888;
        }
        .card.cover-card {
            position: relative;
            overflow: hidden;
            background: #fff;
            border: 1px solid rgba(255,255,255,.55);
        }
        .card.cover-card::before,
        .card.cover-card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .card.cover-card::before {
            background: var(--cover) center/cover no-repeat;
            transform: scale(1.01);
            transition: transform .55s cubic-bezier(.2,.7,.2,1);
        }
        .card.cover-card::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,.02) 0%, rgba(255,255,255,.06) 30%, rgba(248,250,252,.52) 58%, rgba(248,250,252,.94) 80%, rgba(248,250,252,.98) 100%),
                radial-gradient(65% 45% at 50% 64%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%);
        }
        .card.cover-card > * {
            position: relative;
            z-index: 1;
        }
        .card.cover-card:hover::before {
            transform: scale(1.055);
        }
        footer {
            margin-top: 64px;
            color: #aaa;
            font-size: 0.85rem;
        }
        /* Password gate overlay */
        #gate {
            position: fixed;
            inset: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 16px;
        }
        #gate.hidden {
            display: none;
        }
        #gate h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        #gate input {
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            outline: none;
            width: 240px;
            text-align: center;
        }
        #gate button {
            padding: 12px 32px;
            font-size: 1rem;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #gate button:hover {
            background: #357abd;
        }
        #gate .error {
            color: #ff6b6b;
            font-size: 0.9rem;
            height: 20px;
        }
    </style>
</head>
<body>
    <!-- Password gate overlay -->
    <div id="gate">
        <h2>旅行地图</h2>
        <input type="password" id="pwd" placeholder="请输入密码" autofocus>
        <button onclick="checkPwd()">进入</button>
        <div class="error" id="err"></div>
    </div>

    <!-- Main content (always in DOM, covered by gate) -->
    <h1>旅行地图</h1>
    <p class="subtitle">自驾路线 & 行程规划</p>

    <div class="grid">
        <a class="card cover-card" href="安徽2027/" style="--cover:url('安徽2027/huangshan.jpg');">
            <div class="icon">🏔️</div>
            <div class="title">安徽 2027</div>
            <div class="desc">春节自驾</div>
        </a>
        <a class="card cover-card" href="青甘陕自驾2021/" style="--cover:url('青甘陕自驾2021/qinggan-collage.jpg');">
            <div class="icon" style="font-family:serif;">山</div>
            <div class="title">青甘陕 2021</div>
            <div class="desc">带俩娃 · 16天 · 7579公里</div>
        </a>
        <a class="card cover-card" href="港澳马来/" style="--cover:url('港澳马来/cover.jpg');">
            <div class="icon" style="font-family:serif;">南</div>
            <div class="title">下南洋 2025</div>
            <div class="desc">香港 · 澳门 · 西马自驾</div>
        </a>
        <a class="card cover-card" href="东北双城/" style="--cover:url('东北双城/cover.jpg');">
            <div class="icon" style="font-family:serif;">北</div>
            <div class="title">东北双城 2025</div>
            <div class="desc">动卧去 · 长春 / 沈阳</div>
        </a>
        <a class="card cover-card" href="晋陕蜀2025春节/" style="--cover:url('晋陕蜀2025春节/cover.jpg');">
            <div class="icon" style="font-family:serif;">晋</div>
            <div class="title">晋陕蜀 2025</div>
            <div class="desc">春节 · 古建与石刻</div>
        </a>
        <a class="card cover-card" href="小兴安岭2024十一/" style="--cover:url('小兴安岭2024十一/cover.jpg');">
            <div class="icon" style="font-family:serif;">林</div>
            <div class="title">小兴安岭 2024</div>
            <div class="desc">十一 · 北国秋色</div>
        </a>
        <a class="card cover-card" href="山西2024暑假/" style="--cover:url('山西2024暑假/cover.jpg');">
            <div class="icon" style="font-family:serif;">晋</div>
            <div class="title">山西古建 2024</div>
            <div class="desc">暑假 · 跟着梁林看古建</div>
        </a>
        <a class="card cover-card" href="马来新加坡/" style="--cover:url('马来新加坡/cover.jpg');">
            <div class="icon" style="font-family:serif;">新</div>
            <div class="title">新马 2024</div>
            <div class="desc">五一 · 乐高 / 圣淘沙</div>
        </a>
        <a class="card cover-card" href="大同2024清明/" style="--cover:url('大同2024清明/cover.jpg');">
            <div class="icon" style="font-family:serif;">魏</div>
            <div class="title">大同 2024</div>
            <div class="desc">清明 · 云冈 / 悬空寺</div>
        </a>
        <a class="card cover-card" href="二连浩特2024中秋/" style="--cover:url('二连浩特2024中秋/cover.jpg');">
            <div class="icon" style="font-family:serif;">恐</div>
            <div class="title">二连浩特 2024</div>
            <div class="desc">中秋 · 国门 / 恐龙 / 大红山</div>
        </a>
        <!-- 以后加新城市在这里加卡片 -->
        <!--
        <a class="card" href="北京/">
            <div class="icon">🏯</div>
            <div class="title">北京</div>
            <div class="desc">2027 春游</div>
        </a>
        -->
    </div>

    <footer>Powered by GitHub Pages</footer>

    <script>
        (function() {
            var gate = document.getElementById('gate');
            var key = 'tm_unlock_time';
            var EIGHT_HOURS = 8 * 3600000; // 8 hours in ms

            function isUnlocked() {
                var t = parseInt(localStorage.getItem(key) || '0', 10);
                return (Date.now() - t) < EIGHT_HOURS;
            }

            if (isUnlocked()) {
                gate.classList.add('hidden');
            }

            window.checkPwd = function() {
                var pwd = document.getElementById('pwd').value;
                if (pwd === 'miaowei2027') {
                    localStorage.setItem(key, String(Date.now()));
                    gate.classList.add('hidden');
                } else {
                    document.getElementById('err').textContent = '密码错误';
                    document.getElementById('pwd').value = '';
                }
            };
            document.getElementById('pwd').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') checkPwd();
            });
        })();
    </script>
</body>
</html>
