<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        h1 {
            font-size: 2.5rem;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 48px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 800px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            text-decoration: none;
            color: #1a1a2e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .card .icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        .card .title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card .desc {
            font-size: 0.9rem;
            color: #888;
        }
        footer {
            margin-top: 64px;
            color: #aaa;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>旅行地图</h1>
    <p class="subtitle">自驾路线 & 行程规划</p>

    <div class="grid">
        <a class="card" href="安徽2027/">
            <div class="icon">🏔️</div>
            <div class="title">安徽 2027</div>
            <div class="desc">春节自驾</div>
        </a>
        <!-- 以后加新城市在这里加卡片 -->
        <!--
        <a class="card" href="北京/">
            <div class="icon">🏯</div>
            <div class="title">北京</div>
            <div class="desc">2027 春游</div>
        </a>
        -->
    </div>

    <footer>Powered by GitHub Pages</footer>
</body>
</html>
